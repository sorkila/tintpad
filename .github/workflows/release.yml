name: Release

# Manual release build. Click "Run workflow" in the Actions tab.
#
# Secrets (all optional — without them you get an unsigned, runnable artifact):
#   SIGN_IDENTITY    "Developer ID Application: Your Name (TEAMID)" — enables
#                    codesigning + notarization and the signed-artifact path.
#   SIGNING_CERT_P12 base64-encoded Developer ID .p12 to import into a temp keychain.
#   SIGNING_CERT_PWD password for the .p12 above.
#   NOTARY_PROFILE   notarytool keychain profile name. Created here from the three
#                    App Store Connect API secrets below (only if SIGN_IDENTITY is set).
#   NOTARY_KEY       App Store Connect API key (.p8) contents.
#   NOTARY_KEY_ID    its Key ID.
#   NOTARY_ISSUER    its Issuer ID.
#   SPARKLE_ED_KEY   Sparkle EdDSA private key — used to sign the appcast entry.
#                    (Public key SUPublicEDKey lives in Resources/Info.plist.)

on:
  workflow_dispatch:

# Builds and uploads a workflow artifact, never writes to the repo or a release.
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15   # match CI; bump to macos-26 once available
    # The `secrets` context is NOT allowed in `if:` (it causes a workflow
    # startup failure on every push), so the job env carries what the `if:`s
    # gate on: SIGN_IDENTITY and NOTARY_PROFILE (names, which package.sh also
    # reads) and a true/false for each credential. The credentials themselves
    # live in the env of the one step that uses them.
    env:
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
      NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      # Same cache as CI. package.sh does the release build, so there is no
      # separate build step.
      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-macos-15-${{ hashFiles('Package.swift') }}
          restore-keys: |
            spm-macos-15-

      - name: Release consistency
        run: ./Scripts/check-release.sh --ci

      # --- Signing setup (only when SIGN_IDENTITY is present) -----------------
      # package.sh self-gates on SIGN_IDENTITY / NOTARY_PROFILE, so everything
      # below is a no-op when the secrets are absent. The job still succeeds and
      # produces an unsigned artifact.

      - name: Import signing certificate
        if: ${{ env.SIGN_IDENTITY != '' && env.HAS_SIGNING_CERT == 'true' }}
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PWD: ${{ secrets.SIGNING_CERT_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/cert.p12"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$SIGNING_CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$CERT"

      - name: Set up notary profile
        if: ${{ env.SIGN_IDENTITY != '' && env.HAS_NOTARY_KEY == 'true' }}
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY" > "$KEY"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm -f "$KEY"

      # --- Package ------------------------------------------------------------
      # Builds .build/release/Tintpad.app. Signs + notarizes only if the env
      # vars are set; otherwise emits an unsigned bundle.

      - name: Package
        # SIGN_IDENTITY / NOTARY_PROFILE come from the job env above; package.sh
        # treats empty values as "skip signing".
        run: ./Scripts/package.sh

      # --- Sparkle appcast signature (signed builds only, optional) -----------

      - name: Sign appcast entry (Sparkle)
        if: ${{ env.SIGN_IDENTITY != '' && env.HAS_SPARKLE_KEY == 'true' }}
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        # The key reaches sign_update on stdin (`--ed-key-file -`, as its --help
        # documents), and the signature is checked against SUPublicEDKey the way
        # release.sh checks it.
        run: |
          set -euo pipefail
          . Scripts/release-lib.sh
          DMG=".build/release/Tintpad.dmg"
          SIGN_UPDATE="$(find_sign_update)"
          SIG="$(printf '%s' "$SPARKLE_ED_KEY" | "$SIGN_UPDATE" --ed-key-file - "$DMG")"
          ENCLOSURE="$(parse_enclosure "$SIG")"
          swift Scripts/verify-ed25519.swift \
            "$(plist_get Resources/Info.plist SUPublicEDKey)" "${ENCLOSURE% *}" "$DMG"
          echo "Appcast enclosure attributes for $DMG (verified against SUPublicEDKey):"
          echo "$SIG"

      # --- Zip + upload -------------------------------------------------------

      - name: Zip Tintpad.app
        run: |
          set -euo pipefail
          # ditto preserves bundle metadata/symlinks (notarization-safe).
          ditto -c -k --keepParent ".build/release/Tintpad.app" "Tintpad.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tintpad-app
          path: Tintpad.zip
          if-no-files-found: error
