name: Deploy site

# Publishes web/ to the Inleed host over FTP, on every push that touches the site.
# Wired the same way as sorkila/lockpaw-web.
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     the Inleed server address (NOT the domain — per Inleed docs use
#                  the server host/IP; the domain only works once its DNS is live)
#   FTP_USERNAME   the FTP login (admin@tintpad.com)
#   FTP_PASSWORD   the FTP password

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./web/
          server-dir: /public_html/
